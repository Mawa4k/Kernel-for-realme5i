name: Kernel Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

    - name: Checkout kernel source
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          build-essential \
          bc \
          bison \
          flex \
          libssl-dev \
          libelf-dev \
          gcc-aarch64-linux-gnu \
          python3 \
          cpio \
          rsync

    - name: Setup Clang
      run: |
        sudo apt install -y clang lld llvm

        clang --version
        ld.lld --version

    - name: Prepare kernel config
      run: |
        mkdir -p out

        cp vendor/trinket_defconfig out/.config

        scripts/config --disable WERROR || true
        scripts/config --disable MODULE_SIG || true
        scripts/config --disable MODULE_SIG_FORCE || true

        make O=out ARCH=arm64 olddefconfig

    - name: Build Kernel
      run: |
        export ARCH=arm64
        export LLVM=1
        export LLVM_IAS=1

        export KCFLAGS="-Wno-array-bounds -Wno-error"
        export CFLAGS_KERNEL="-Wno-array-bounds -Wno-error"

        make O=out \
          ARCH=arm64 \
          LLVM=1 \
          LLVM_IAS=1 \
          KCFLAGS="$KCFLAGS" \
          CFLAGS_KERNEL="$CFLAGS_KERNEL" \
          -j$(nproc)

    - name: Check Kernel Image
      run: |
        ls -lh out/arch/arm64/boot/

        if [ -f out/arch/arm64/boot/Image.gz ]; then
          echo "Kernel Image exists."
        else
          echo "Kernel Image missing!"
          exit 1
        fi

    - name: Upload Kernel Image
      uses: actions/upload-artifact@v4
      with:
        name: realme5i-kernel-image
        path: |
          out/arch/arm64/boot/Image.gz
          out/.config

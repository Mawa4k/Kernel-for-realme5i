name: Realme 5i Kernel Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

    - name: Checkout source
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          bc \
          bison \
          flex \
          build-essential \
          libssl-dev \
          libelf-dev \
          python3 \
          cpio \
          rsync \
          clang-18 \
          lld-18 \
          llvm-18 \
          gcc-aarch64-linux-gnu

    - name: Check toolchain
      run: |
        clang-18 --version
        ld.lld-18 --version

    - name: Prepare config
      run: |
        mkdir -p out

        cp arch/arm64/configs/defconfig out/.config

        sed -i 's/CONFIG_WERROR=y/# CONFIG_WERROR is not set/' out/.config || true
        sed -i 's/CONFIG_MODULE_SIG=y/# CONFIG_MODULE_SIG is not set/' out/.config || true
        sed -i 's/CONFIG_MODULE_SIG_FORCE=y/# CONFIG_MODULE_SIG_FORCE is not set/' out/.config || true

        make O=out ARCH=arm64 olddefconfig

    - name: Build kernel
      run: |
        export PATH=/usr/lib/llvm-18/bin:$PATH

        make O=out \
          ARCH=arm64 \
          LLVM=1 \
          LLVM_IAS=1 \
          CC=clang-18 \
          LD=ld.lld-18 \
          KCFLAGS="-Wno-array-bounds -Wno-error" \
          -j$(nproc)

    - name: Check Image
      run: |
        ls -lh out/arch/arm64/boot/

        test -f out/arch/arm64/boot/Image.gz && echo "Kernel Image OK"

    - name: Upload Kernel
      uses: actions/upload-artifact@v4
      with:
        name: realme5i-stock-kernel
        path: |
          out/arch/arm64/boot/Image.gz
          out/.config

name: Build Realme 5i Kernel

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl wget flex g++-multilib gcc-multilib git gnupg gperf imagemagick libelf-dev liblz4-tool libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc yasm zlib1g-dev python3

      - name: Setup Clang Toolchain (Clang 18+)
        run: |
          mkdir -p $HOME/clang
          cd $HOME/clang
          # Git ক্লোন বাদ দিয়ে সরাসরি wget দিয়ে AOSP Clang রিলিজ জিপ ডাউনলোড করা
          wget -O clang.zip https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android14-release/clang-r510928.tar.gz || \
          wget -O clang.zip https://github.com/LineageOS/android_prebuilts_clang_host_linux-x86_clang-r510928/archive/refs/heads/main.zip
          
          # ফোল্ডার তৈরি করে এক্সট্রাক্ট করা
          mkdir -p extracted_clang
          tar -xzf clang.zip -C extracted_clang || unzip -q clang.zip -d extracted_clang
          
          # পাথ সেটআপ
          echo "$HOME/clang/extracted_clang/bin" >> $GITHUB_PATH

      - name: Build Kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH=$HOME/clang/extracted_clang/bin:$PATH
          
          # ডিফকনফিগ লোড করা
          make O=out trinket_defconfig
          
          # ডিফকনফিগে মডিউল ও সিগনেচার কনফিগারেশন আপডেট করা
          echo "CONFIG_MODULES=y" >> out/.config
          echo "CONFIG_MODULE_FORCE_LOAD=y" >> out/.config
          echo "CONFIG_MODULE_UNLOAD=y" >> out/.config
          echo "CONFIG_MODULE_FORCE_UNLOAD=y" >> out/.config
          echo "CONFIG_MODULE_SIG=n" >> out/.config
          echo "CONFIG_MODULE_SIG_FORCE=n" >> out/.config
          echo "CONFIG_MODULE_SIG_ALL=n" >> out/.config
          
          # কার্নেল কম্পাইল শুরু করা
          make -j$(nproc --all) O=out CC=clang LD=ld.lld

      - name: Upload Kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: Image.gz-dtb
          path: out/arch/arm64/boot/Image.gz-dtb

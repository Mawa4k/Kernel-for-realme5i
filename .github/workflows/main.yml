name: Realme 5i Stock Kernel Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

    - name: Checkout Kernel Source
      uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          bc \
          bison \
          flex \
          build-essential \
          libssl-dev \
          libelf-dev \
          python3 \
          cpio \
          rsync \
          clang-18 \
          lld-18 \
          llvm-18 \
          gcc-aarch64-linux-gnu

    - name: Check LLVM Toolchain
      run: |
        clang-18 --version
        ld.lld-18 --version

    - name: Prepare Kernel Config
      run: |
        mkdir -p out

        cp arch/arm64/configs/defconfig out/.config

        scripts/config --disable WERROR || true
        scripts/config --disable MODULE_SIG || true
        scripts/config --disable MODULE_SIG_FORCE || true

        make O=out ARCH=arm64 olddefconfig


    - name: Patch Clang 18 Compatibility
      run: |

        # Fix ARM64 spinlock immediate constraint
        sed -i 's/"I" (1 << TICKET_SHIFT)/"r" (1 << TICKET_SHIFT)/g' \
        arch/arm64/include/asm/spinlock.h

        # Fix old kernel array bounds warning
        sed -i 's/case 2: set->sig\[1\] = -1;/case 2: if (_NSIG_WORDS > 1) set->sig[1] = -1;/' \
        include/linux/signal.h || true


    - name: Build Kernel
      run: |

        export PATH=/usr/lib/llvm-18/bin:$PATH

        make O=out \
          ARCH=arm64 \
          LLVM=1 \
          LLVM_IAS=1 \
          CC=clang-18 \
          LD=ld.lld-18 \
          KCFLAGS="-Wno-array-bounds -Wno-error" \
          CFLAGS_KERNEL="-Wno-array-bounds -Wno-error" \
          -j$(nproc)


    - name: Verify Kernel Image
      run: |

        ls -lh out/arch/arm64/boot/

        if [ -f out/arch/arm64/boot/Image.gz ]; then
          echo "Kernel Image exists"
        elif [ -f out/arch/arm64/boot/Image ]; then
          echo "Kernel Image exists"
        else
          echo "Kernel Image missing"
          exit 1
        fi


    - name: Upload Kernel Output
      uses: actions/upload-artifact@v4
      with:
        name: realme5i-stock-kernel
        path: |
          out/arch/arm64/boot/*
          out/.config

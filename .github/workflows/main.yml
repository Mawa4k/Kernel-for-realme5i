name: Realme5i Kernel Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

    - name: Checkout
      uses: actions/checkout@v4
      with:
        clean: true


    - name: Install Dependencies
      run: |
        sudo apt update

        sudo apt install -y \
          bc bison flex \
          build-essential \
          libssl-dev \
          libelf-dev \
          python3 \
          python-is-python3 \
          cpio rsync \
          clang-14 llvm-14 lld-14 \
          gcc-aarch64-linux-gnu \
          device-tree-compiler


    - name: Prepare
      run: |
        rm -rf out
        mkdir out


    - name: Setup Config
      run: |

        export PATH=/usr/lib/llvm-14/bin:$PATH


        make O=out \
        ARCH=arm64 \
        LLVM=1 \
        LLVM_IAS=1 \
        CC=clang-14 \
        LD=ld.lld-14 \
        vendor/trinket_oppo/trinket_defconfig


        ./scripts/config --file out/.config \
        -d CC_STACKPROTECTOR_STRONG \
        -d CC_STACKPROTECTOR_REGULAR \
        -e CC_STACKPROTECTOR_NONE \
        -d MODULE_SIG \
        -d MODULE_SIG_FORCE


        make O=out ARCH=arm64 olddefconfig



    - name: Build Kernel
      run: |

        export PATH=/usr/lib/llvm-14/bin:$PATH


        make -j$(nproc) \
        O=out \
        ARCH=arm64 \
        LLVM=1 \
        LLVM_IAS=1 \
        CC=clang-14 \
        LD=ld.lld-14 \
        AR=llvm-ar-14 \
        NM=llvm-nm-14 \
        OBJCOPY=llvm-objcopy-14 \
        STRIP=llvm-strip-14 \
        CROSS_COMPILE=aarch64-linux-gnu- \
        KCFLAGS="-Wno-error" \
        2>&1 | tee build.log



    - name: Check Image
      if: always()
      run: |

        ls -lh out/arch/arm64/boot/ || true

        tail -100 build.log



    - name: Upload
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Realme5i-Kernel
        path: |
          out/arch/arm64/boot/*
          out/.config
          build.log
        if-no-files-found: warn

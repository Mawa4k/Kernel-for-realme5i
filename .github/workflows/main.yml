name: Realme Trinket Kernel Build Clang18

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

    - name: Checkout Kernel Source
      uses: actions/checkout@v4


    - name: Install Dependencies
      run: |
        sudo apt update

        sudo apt install -y \
          bc \
          bison \
          flex \
          build-essential \
          libssl-dev \
          libelf-dev \
          dwarves \
          python3 \
          wget \
          gnupg \
          lsb-release \
          software-properties-common \
          gcc-aarch64-linux-gnu


    - name: Install LLVM Clang 18
      run: |
        wget https://apt.llvm.org/llvm.sh

        chmod +x llvm.sh

        sudo ./llvm.sh 18

        clang-18 --version
        ld.lld-18 --version


    - name: Setup LLVM
      run: |
        sudo update-alternatives \
        --install /usr/bin/clang clang /usr/bin/clang-18 100

        sudo update-alternatives \
        --install /usr/bin/ld.lld ld.lld /usr/bin/ld.lld-18 100

        clang --version
        ld.lld --version


    - name: Create Out Directory
      run: |
        mkdir -p out


    - name: Setup Trinket Defconfig
      run: |

        if [ -f arch/arm64/configs/vendor/trinket_defconfig ]; then
          cp arch/arm64/configs/vendor/trinket_defconfig out/.config

        elif [ -f arch/arm64/configs/trinket_defconfig ]; then
          cp arch/arm64/configs/trinket_defconfig out/.config

        else
          echo "Defconfig not found"
          exit 1
        fi


        make \
        O=out \
        ARCH=arm64 \
        olddefconfig



    - name: Fix Old Kernel Config
      run: |

        scripts/config --file out/.config \
        -d CONFIG_WERROR


        scripts/config --file out/.config \
        -d CONFIG_MODULE_SIG \
        -d CONFIG_MODULE_SIG_FORCE


        scripts/config --file out/.config \
        -e CONFIG_MODULES \
        -e CONFIG_MODULE_UNLOAD \
        -e CONFIG_MODULE_FORCE_LOAD \
        -e CONFIG_MODULE_FORCE_UNLOAD


        make \
        O=out \
        ARCH=arm64 \
        olddefconfig



    - name: Build Kernel
      run: |

        set -o pipefail

        make \
        O=out \
        ARCH=arm64 \
        CC=clang \
        LLVM=1 \
        LLVM_IAS=1 \
        CROSS_COMPILE=aarch64-linux-gnu- \
        KCFLAGS="-Wno-error" \
        -j$(nproc) 2>&1 | tee build.log



    - name: Error Report
      if: failure()
      run: |

        echo "========== BUILD ERROR =========="

        if [ -f build.log ]; then

          grep -iE \
          "error:|fatal:|modpost|ld.lld|undefined|failed" \
          build.log | tail -200

        else

          echo "No build.log found"

        fi



    - name: Check Kernel Image
      run: |

        echo "========== OUTPUT =========="

        ls -lh out/vmlinux || true

        ls -lh out/arch/arm64/boot/Image || true



    - name: Upload Build Log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: kernel-build-log
        path: build.log



    - name: Upload Kernel
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: realme5i-trinket-kernel
        path: |
          out/vmlinux
          out/arch/arm64/boot/Image

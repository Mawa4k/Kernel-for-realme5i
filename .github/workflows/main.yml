name: Realme 5i Kernel Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

    - name: Checkout Kernel Source
      uses: actions/checkout@v4
      with:
        clean: false
        fetch-depth: 1

    - name: Install Dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          bc bison flex build-essential \
          libssl-dev libelf-dev \
          python3 python-is-python3 \
          cpio rsync \
          clang-18 llvm-18 lld-18 \
          gcc-aarch64-linux-gnu \
          binutils-aarch64-linux-gnu \
          device-tree-compiler

    - name: Toolchain Check
      run: |
        clang-18 --version
        ld.lld-18 --version
        aarch64-linux-gnu-gcc --version

    - name: Setup Defconfig
      run: |
        mkdir -p out

        find arch/arm64/configs -type f -name "*defconfig*"

        DEFCONFIG=$(find arch/arm64/configs -type f \
        -name "*defconfig*" | grep -i trinket | head -n1)

        if [ -z "$DEFCONFIG" ]; then
          DEFCONFIG=$(find arch/arm64/configs \
          -type f -name "*defconfig*" | head -n1)
        fi

        echo "Using $DEFCONFIG"

        make O=out ARCH=arm64 \
        LLVM=1 \
        LLVM_IAS=1 \
        $(basename $DEFCONFIG)

    - name: Build Kernel
      run: |

        export PATH=/usr/lib/llvm-18/bin:$PATH

        make -j$(nproc) \
        O=out \
        ARCH=arm64 \
        LLVM=1 \
        LLVM_IAS=1 \
        CROSS_COMPILE=aarch64-linux-gnu- \
        KCFLAGS="-Wno-error" \
        2>&1 | tee build.log


    - name: Check Output
      if: always()
      run: |

        ls -lh out/arch/arm64/boot/

        test -f out/arch/arm64/boot/Image || \
        test -f out/arch/arm64/boot/Image.gz


    - name: Upload Kernel
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Realme5i-Kernel
        path: |
          out/arch/arm64/boot/*
          out/.config
          build.log

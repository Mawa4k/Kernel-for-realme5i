name: Realme Trinket Kernel Build (Clang 18)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

    - name: Checkout source
      uses: actions/checkout@v4


    - name: Install dependencies
      run: |
        sudo apt update

        sudo apt install -y \
          bc \
          bison \
          flex \
          build-essential \
          libssl-dev \
          libelf-dev \
          dwarves \
          python3 \
          gcc-aarch64-linux-gnu \
          binutils-aarch64-linux-gnu


    - name: Install Clang 18
      run: |
        sudo apt install -y \
          clang-18 \
          lld-18 \
          llvm-18

        clang-18 --version
        ld.lld-18 --version


    - name: Setup LLVM tools
      run: |
        sudo update-alternatives \
        --install /usr/bin/clang clang /usr/bin/clang-18 100

        sudo update-alternatives \
        --install /usr/bin/ld.lld ld.lld /usr/bin/ld.lld-18 100


    - name: Create build directory
      run: |
        mkdir -p out


    - name: Load Trinket defconfig
      run: |
        cp arch/arm64/configs/vendor/trinket_defconfig out/.config

        make O=out \
        ARCH=arm64 \
        olddefconfig


    - name: Kernel config adjustments
      run: |

        scripts/config --file out/.config \
        -d CONFIG_WERROR

        scripts/config --file out/.config \
        -e CONFIG_MODULES \
        -e CONFIG_MODULE_UNLOAD \
        -e CONFIG_MODULE_FORCE_LOAD \
        -e CONFIG_MODULE_FORCE_UNLOAD

        scripts/config --file out/.config \
        -d CONFIG_MODULE_SIG \
        -d CONFIG_MODULE_SIG_FORCE

        make O=out \
        ARCH=arm64 \
        olddefconfig


    - name: Build Kernel
      run: |

        set -o pipefail

        make \
        O=out \
        ARCH=arm64 \
        CC=clang \
        LLVM=1 \
        LLVM_IAS=1 \
        CROSS_COMPILE=aarch64-linux-gnu- \
        KCFLAGS="-Wno-error" \
        -j$(nproc) 2>&1 | tee build.log


    - name: Check Kernel Image
      run: |

        echo "===== OUTPUT ====="

        ls -lh out/vmlinux || true

        ls -lh \
        out/arch/arm64/boot/Image || true


    - name: Upload Build Log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: build.log


    - name: Upload Kernel
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: realme-trinket-kernel
        path: |
          out/vmlinux
          out/arch/arm64/boot/Image

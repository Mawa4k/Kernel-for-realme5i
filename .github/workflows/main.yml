name: Build Realme 5i Stock Kernel

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:

  build:

    runs-on: ubuntu-22.04

    steps:

    - name: Checkout Source
      uses: actions/checkout@v4


    - name: Install Dependencies
      run: |
        sudo apt update

        sudo apt install -y \
        bc \
        bison \
        build-essential \
        ccache \
        flex \
        git \
        libelf-dev \
        libssl-dev \
        libncurses-dev \
        python3 \
        wget \
        curl \
        lzop \
        unzip


    - name: Setup Clang 18
      run: |

        mkdir -p $HOME/clang
        cd $HOME/clang


        wget -q \
        https://github.com/llvm/llvm-project/releases/download/llvmorg-18.1.8/clang+llvm-18.1.8-x86_64-linux-gnu-ubuntu-22.04.tar.xz


        tar -xf clang+llvm-18.1.8-x86_64-linux-gnu-ubuntu-22.04.tar.xz


        mv clang+llvm-18.1.8-x86_64-linux-gnu-ubuntu-22.04 clang


        echo "$HOME/clang/clang/bin" >> $GITHUB_PATH



    - name: Check Kernel Source
      run: |

        echo "Configs:"
        ls arch/arm64/configs

        echo "Vendor configs:"
        ls arch/arm64/configs/vendor || true



    - name: Configure Kernel
      run: |

        export ARCH=arm64


        mkdir -p out


        make O=out vendor/trinket_defconfig



        scripts/config --file out/.config \
        -e MODULES \
        -e MODULE_FORCE_LOAD \
        -e MODULE_UNLOAD \
        -e MODULE_FORCE_UNLOAD \
        -d MODULE_SIG \
        -d MODULE_SIG_FORCE \
        -d MODULE_SIG_ALL



        make O=out olddefconfig



        echo "Module config:"
        grep CONFIG_MODULE out/.config || true



    - name: Build Kernel
      run: |

        export ARCH=arm64
        export SUBARCH=arm64


        export PATH=$HOME/clang/clang/bin:$PATH


        clang --version


        make -j$(nproc --all) \
        O=out \
        ARCH=arm64 \
        CC=clang \
        LD=ld.lld \
        LLVM=1 \
        LLVM_IAS=1



    - name: Check Build Output
      run: |

        ls -lh out/arch/arm64/boot/


    - name: Upload Kernel Image
      uses: actions/upload-artifact@v4

      with:

        name: Realme5i-Stock-Kernel

        path: |
          out/arch/arm64/boot/Image.gz-dtb
          out/arch/arm64/boot/Image

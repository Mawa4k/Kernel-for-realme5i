name: Kernel Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

    - name: Checkout kernel source
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          build-essential \
          bc \
          bison \
          flex \
          libssl-dev \
          libelf-dev \
          dwarves \
          python3 \
          clang \
          lld \
          llvm \
          gcc-aarch64-linux-gnu

    - name: Setup clang environment
      run: |
        clang --version
        ld.lld --version

    - name: Create output directory
      run: |
        mkdir -p out

    - name: Load kernel config
      run: |
        cp arch/arm64/configs/vendor/trinket_defconfig out/.config || true
        make O=out ARCH=arm64 olddefconfig

    - name: Fix cxd224x section mismatch
      run: |
        echo "Searching init_wqueue..."
        grep -R "init_wqueue" -n drivers || true

        FILE=$(grep -rl "init_wqueue" drivers | head -n 1)

        if [ -n "$FILE" ]; then
          echo "Patching $FILE"
          sed -i 's/__init init_wqueue/init_wqueue/g' "$FILE"
          sed -i 's/__init[[:space:]]*init_wqueue/init_wqueue/g' "$FILE"
        fi

    - name: Enable module support options
      run: |
        scripts/config --file out/.config \
          -e CONFIG_MODULES \
          -e CONFIG_MODULE_UNLOAD \
          -e CONFIG_MODULE_FORCE_LOAD \
          -e CONFIG_MODULE_FORCE_UNLOAD

        scripts/config --file out/.config \
          -d CONFIG_MODULE_SIG \
          -d CONFIG_MODULE_SIG_FORCE

        make O=out ARCH=arm64 olddefconfig

    - name: Build kernel
      run: |
        make \
          O=out \
          ARCH=arm64 \
          CC=clang \
          LLVM=1 \
          LLVM_IAS=1 \
          CROSS_COMPILE=aarch64-linux-gnu- \
          -j$(nproc)

    - name: Check Image
      run: |
        ls -lh out/arch/arm64/boot/Image || true
        ls -lh out/vmlinux || true

    - name: Upload kernel
      uses: actions/upload-artifact@v4
      with:
        name: kernel-output
        path: |
          out/arch/arm64/boot/Image
          out/vmlinux

name: Realme 5i Kernel Build

on:
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout Source
      uses: actions/checkout@v4
      with:
        clean: true
        fetch-depth: 1


    - name: Install Dependencies
      run: |
        sudo apt update

        sudo apt install -y \
          bc bison flex build-essential \
          libssl-dev libelf-dev \
          python3 python-is-python3 \
          cpio rsync \
          clang-18 llvm-18 lld-18 \
          gcc-aarch64-linux-gnu \
          binutils-aarch64-linux-gnu \
          device-tree-compiler \
          kmod


    - name: Toolchain
      run: |
        clang-18 --version
        ld.lld-18 --version
        aarch64-linux-gnu-gcc --version


    - name: Select Defconfig
      id: cfg
      run: |

        echo "Available configs:"
        find arch/arm64/configs -type f -name "*defconfig*" | sort


        DEF="arch/arm64/configs/vendor/trinket_oppo/trinket-perf_defconfig"


        if [ ! -f "$DEF" ]; then
          DEF="arch/arm64/configs/vendor/trinket_oppo/trinket_defconfig"
        fi


        if [ ! -f "$DEF" ]; then
          echo "No trinket config found"
          exit 1
        fi


        echo "Using $DEF"


        echo "defconfig=$(echo $DEF | sed 's|arch/arm64/configs/||')" >> $GITHUB_OUTPUT



    - name: Prepare Out
      run: |
        rm -rf out
        mkdir out



    - name: Generate Config
      env:
        DEFCONFIG: ${{ steps.cfg.outputs.defconfig }}

      run: |

        export PATH=/usr/lib/llvm-18/bin:$PATH


        make O=out \
          ARCH=arm64 \
          CC=clang-18 \
          LD=ld.lld-18 \
          CLANG_TRIPLE=aarch64-linux-gnu- \
          CROSS_COMPILE=aarch64-linux-gnu- \
          $DEFCONFIG



        ./scripts/config --file out/.config \
          --disable CONFIG_CC_STACKPROTECTOR_STRONG \
          --disable CONFIG_CC_STACKPROTECTOR_REGULAR \
          --enable CONFIG_CC_STACKPROTECTOR_NONE \
          --disable CONFIG_STACK_VALIDATION



        sed -i \
        's/CONFIG_CC_STACKPROTECTOR_STRONG=y/# CONFIG_CC_STACKPROTECTOR_STRONG is not set/' \
        out/.config


        sed -i \
        's/CONFIG_CC_STACKPROTECTOR_REGULAR=y/# CONFIG_CC_STACKPROTECTOR_REGULAR is not set/' \
        out/.config



        yes "" | make O=out \
          ARCH=arm64 \
          CC=clang-18 \
          LD=ld.lld-18 \
          CLANG_TRIPLE=aarch64-linux-gnu- \
          CROSS_COMPILE=aarch64-linux-gnu- \
          olddefconfig



        grep STACKPROTECTOR out/.config || true



    - name: Clang Compatibility Patch
      run: |


        if [ -f arch/arm64/include/asm/spinlock.h ]; then

          sed -i \
          's/"I" (1 << TICKET_SHIFT)/"r" (1 << TICKET_SHIFT)/g' \
          arch/arm64/include/asm/spinlock.h || true

        fi



        if [ -f drivers/clk/qcom/mdss/mdss-dsi-pll-14nm-util.c ]; then

          sed -i \
          's/%lu/%u/g' \
          drivers/clk/qcom/mdss/mdss-dsi-pll-14nm-util.c || true

        fi



    - name: Build Kernel

      run: |

        export PATH=/usr/lib/llvm-18/bin:$PATH


        set -o pipefail


        make -j$(nproc) \
          O=out \
          ARCH=arm64 \
          LLVM=1 \
          LLVM_IAS=1 \
          CC=clang-18 \
          LD=ld.lld-18 \
          AR=llvm-ar \
          NM=llvm-nm \
          OBJCOPY=llvm-objcopy \
          OBJDUMP=llvm-objdump \
          STRIP=llvm-strip \
          CLANG_TRIPLE=aarch64-linux-gnu- \
          CROSS_COMPILE=aarch64-linux-gnu- \
          KCFLAGS="-Wno-error \
          -Wno-format \
          -Wno-array-bounds \
          -Wno-unused-variable \
          -Wno-unused-but-set-variable \
          -Wno-implicit-function-declaration" \
          2>&1 | tee build.log



    - name: Show Error If Failed

      if: failure()

      run: |

        echo "===== LAST LOG ====="

        tail -200 build.log


        echo "===== ERROR ====="

        grep -nEi \
        "error:|failed|fatal|undefined|cannot|No rule" \
        build.log || true



    - name: Check Image

      if: always()

      run: |

        ls -lh out/arch/arm64/boot/ || true


        if [ -f out/arch/arm64/boot/Image.gz ] || \
           [ -f out/arch/arm64/boot/Image ]; then

          echo "Kernel Image OK"

        else

          echo "Kernel Image not found"

        fi



    - name: Upload Artifact

      if: always()

      uses: actions/upload-artifact@v4

      with:

        name: Realme5i-Kernel

        path: |

          out/arch/arm64/boot/*

          out/.config

          build.log

        if-no-files-found: warn

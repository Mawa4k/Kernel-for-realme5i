name: Realme5i Kernel Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout source
      uses: actions/checkout@v4

    - name: Install packages
      run: |
        sudo apt update
        sudo apt install -y bc bison flex build-essential libssl-dev libelf-dev python3 wget gcc-aarch64-linux-gnu

    - name: Install Clang 18
      run: |
        wget https://apt.llvm.org/llvm.sh
        chmod +x llvm.sh
        sudo ./llvm.sh 18
        clang-18 --version

    - name: Prepare output
      run: |
        mkdir -p out

    - name: Load defconfig
      run: |
        cp arch/arm64/configs/vendor/trinket_defconfig out/.config
        make O=out ARCH=arm64 olddefconfig

    - name: Build kernel
      run: |
        make \
          O=out \
          ARCH=arm64 \
          CC=clang-18 \
          LLVM=1 \
          LLVM_IAS=1 \
          CROSS_COMPILE=aarch64-linux-gnu- \
          -j$(nproc)

    - name: Upload log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: |
          out/.config

name: Realme 5i Kernel Build

on:
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout Kernel
      uses: actions/checkout@v4


    - name: Install Dependencies
      run: |
        sudo apt update

        sudo apt install -y \
          bc \
          bison \
          flex \
          build-essential \
          libssl-dev \
          libelf-dev \
          python3 \
          cpio \
          rsync \
          clang-18 \
          lld-18 \
          llvm-18 \
          gcc-aarch64-linux-gnu


    - name: Toolchain Check
      run: |
        clang-18 --version
        ld.lld-18 --version


    - name: Clean Output Only
      run: |
        rm -rf out
        mkdir -p out


    - name: Disable Realme Dirty Source Check
      run: |
        python3 - <<'PY'
        from pathlib import Path

        p = Path("Makefile")
        s = p.read_text()

        s = s.replace(
            "echo >&2 \"  .. is not clean, please run 'make mrproper'\";",
            "true;"
        )

        s = s.replace(
            "echo >&2 \"  in the '..' directory.\";",
            "true;"
        )

        p.write_text(s)

        print("prepare3 check patched")
        PY


    - name: Prepare Config
      run: |

        cp arch/arm64/configs/defconfig out/.config

        export KBUILD_OUTPUT=$PWD/out

        scripts/config --disable WERROR || true
        scripts/config --disable MODULE_SIG || true
        scripts/config --disable MODULE_SIG_FORCE || true

        make O=out ARCH=arm64 olddefconfig


    - name: Clang 18 Fix
      run: |

        sed -i \
        's/"I" (1 << TICKET_SHIFT)/"r" (1 << TICKET_SHIFT)/g' \
        arch/arm64/include/asm/spinlock.h


        sed -i \
        's/case 2: set->sig\[1\] = -1;/case 2: if (_NSIG_WORDS > 1) set->sig[1] = -1;/' \
        include/linux/signal.h || true


    - name: Build Kernel
      run: |

        export PATH=/usr/lib/llvm-18/bin:$PATH
        export KBUILD_OUTPUT=$PWD/out

        make O=out \
          ARCH=arm64 \
          LLVM=1 \
          LLVM_IAS=1 \
          CC=clang-18 \
          LD=ld.lld-18 \
          KCFLAGS="-Wno-array-bounds -Wno-error" \
          CFLAGS_KERNEL="-Wno-array-bounds -Wno-error" \
          -j$(nproc) 2>&1 | tee build.log

        exit ${PIPESTATUS[0]}


    - name: Check Image
      run: |

        ls -lh out/arch/arm64/boot/

        if [ -f out/arch/arm64/boot/Image.gz ]; then
          echo "Kernel Image OK"

        elif [ -f out/arch/arm64/boot/Image ]; then
          echo "Kernel Image OK"

        else
          echo "Kernel Image missing"
          exit 1
        fi


    - name: Upload Kernel
      uses: actions/upload-artifact@v4
      with:
        name: Realme5i-Kernel
        path: |
          out/arch/arm64/boot/*
          out/.config
          build.log

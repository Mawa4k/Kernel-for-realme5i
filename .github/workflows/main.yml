name: Build Realme 5i Stock Kernel

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

    - name: Checkout Kernel Source
      uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          bc bison build-essential ccache curl flex \
          git libelf-dev libssl-dev libncurses-dev \
          python3 unzip wget lzop

    - name: Setup Clang 18
      run: |
        mkdir -p $HOME/clang
        cd $HOME/clang

        git clone --depth=1 \
        https://github.com/kdrag0n/proton-clang.git clang

        echo "$HOME/clang/clang/bin" >> $GITHUB_PATH

    - name: Prepare Kernel Config
      run: |
        export ARCH=arm64

        echo "Checking configs..."
        ls arch/arm64/configs

        make O=out trinket_defconfig

        scripts/config --file out/.config \
        -e MODULES \
        -e MODULE_FORCE_LOAD \
        -e MODULE_UNLOAD \
        -e MODULE_FORCE_UNLOAD \
        -d MODULE_SIG \
        -d MODULE_SIG_FORCE \
        -d MODULE_SIG_ALL

        make O=out olddefconfig


    - name: Build Kernel
      run: |
        export ARCH=arm64
        export SUBARCH=arm64
        export PATH=$HOME/clang/clang/bin:$PATH

        make -j$(nproc --all) \
        O=out \
        ARCH=arm64 \
        CC=clang \
        LLVM=1 \
        LLVM_IAS=1


    - name: Check Image
      run: |
        ls -lh out/arch/arm64/boot/


    - name: Upload Kernel Image
      uses: actions/upload-artifact@v4
      with:
        name: Realme5i-Stock-Kernel
        path: |
          out/arch/arm64/boot/Image.gz-dtb
          out/arch/arm64/boot/Image

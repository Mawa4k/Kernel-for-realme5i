name: Build Realme 5i Stock Kernel

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master


jobs:

  build:

    runs-on: ubuntu-22.04


    steps:

    - name: Checkout Kernel Source
      uses: actions/checkout@v4


    - name: Install Dependencies
      run: |
        sudo apt update

        sudo apt install -y \
          bc \
          bison \
          build-essential \
          ccache \
          flex \
          git \
          libelf-dev \
          libssl-dev \
          libncurses-dev \
          python3 \
          lzop \
          unzip \
          clang-18 \
          llvm-18 \
          lld-18


    - name: Setup Clang
      run: |

        clang-18 --version
        ld.lld-18 --version


        sudo update-alternatives --install \
        /usr/bin/clang clang \
        /usr/bin/clang-18 100


        sudo update-alternatives --install \
        /usr/bin/ld.lld ld.lld \
        /usr/bin/ld.lld-18 100



    - name: Check Source
      run: |

        echo "ARM64 configs:"
        ls arch/arm64/configs

        echo "Vendor configs:"
        ls arch/arm64/configs/vendor || true



    - name: Configure Kernel
      run: |

        export ARCH=arm64


        mkdir -p out


        make O=out vendor/trinket_defconfig



        scripts/config --file out/.config \
        -e MODULES \
        -e MODULE_FORCE_LOAD \
        -e MODULE_UNLOAD \
        -e MODULE_FORCE_UNLOAD \
        -d MODULE_SIG \
        -d MODULE_SIG_FORCE \
        -d MODULE_SIG_ALL



        make O=out olddefconfig



        echo "Checking modules:"
        grep CONFIG_MODULE out/.config || true



    - name: Build Kernel
      run: |

        export ARCH=arm64
        export SUBARCH=arm64


        make -j$(nproc --all) \
        O=out \
        ARCH=arm64 \
        CC=clang \
        LD=ld.lld \
        LLVM=1 \
        LLVM_IAS=1



    - name: Verify Kernel Image
      run: |

        echo "Build output:"
        ls -lh out/arch/arm64/boot/



    - name: Upload Kernel Image
      uses: actions/upload-artifact@v4

      with:

        name: Realme5i-Stock-Kernel-Image

        path: |
          out/arch/arm64/boot/Image.gz-dtb
          out/arch/arm64/boot/Image

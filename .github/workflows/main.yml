name: Realme 5i Kernel Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

    - name: Checkout Kernel Source
      uses: actions/checkout@v4
      with:
        clean: true
        fetch-depth: 1

    - name: Install Dependencies
      run: |
        sudo apt update

        sudo apt install -y \
          bc bison flex build-essential \
          libssl-dev libelf-dev \
          python3 python-is-python3 \
          cpio rsync \
          clang-18 llvm-18 lld-18 \
          gcc-aarch64-linux-gnu \
          binutils-aarch64-linux-gnu \
          device-tree-compiler \
          kmod

    - name: Toolchain Check
      run: |
        clang-18 --version
        ld.lld-18 --version
        aarch64-linux-gnu-gcc --version


    - name: Find Defconfig
      id: findcfg
      run: |

        echo "Searching defconfig..."

        find arch/arm64/configs -type f -name '*defconfig*' | sort


        CFG="arch/arm64/configs/vendor/trinket_oppo/trinket-perf_defconfig"


        if [ ! -f "$CFG" ]; then
          CFG="arch/arm64/configs/vendor/trinket_oppo/trinket_defconfig"
        fi


        if [ ! -f "$CFG" ]; then
          echo "Defconfig not found!"
          exit 1
        fi


        echo "Using:"
        echo "$CFG"


        REL=$(echo "$CFG" | sed 's|arch/arm64/configs/||')


        echo "defconfig=$REL" >> $GITHUB_OUTPUT



    - name: Create Out Directory
      run: |
        rm -rf out
        mkdir out



    - name: Setup Kernel Config
      env:
        DEFCONFIG: ${{ steps.findcfg.outputs.defconfig }}

      run: |

        export PATH=/usr/lib/llvm-18/bin:$PATH


        make O=out ARCH=arm64 \
          CC=clang-18 \
          LD=ld.lld-18 \
          CLANG_TRIPLE=aarch64-linux-gnu- \
          CROSS_COMPILE=aarch64-linux-gnu- \
          $DEFCONFIG



        echo "Disable stack protector"


        ./scripts/config --file out/.config \
          --disable CONFIG_CC_STACKPROTECTOR_STRONG \
          --disable CONFIG_CC_STACKPROTECTOR_REGULAR \
          --enable CONFIG_CC_STACKPROTECTOR_NONE \
          --disable CONFIG_STACK_VALIDATION



        sed -i \
        -e 's/CONFIG_CC_STACKPROTECTOR_STRONG=y/# CONFIG_CC_STACKPROTECTOR_STRONG is not set/' \
        -e 's/CONFIG_CC_STACKPROTECTOR_REGULAR=y/# CONFIG_CC_STACKPROTECTOR_REGULAR is not set/' \
        out/.config



        yes "" | make O=out ARCH=arm64 \
          CC=clang-18 \
          LD=ld.lld-18 \
          CLANG_TRIPLE=aarch64-linux-gnu- \
          CROSS_COMPILE=aarch64-linux-gnu- \
          olddefconfig



        echo "Final config:"
        grep STACKPROTECTOR out/.config || true



    - name: Apply Clang Fix
      run: |


        if [ -f arch/arm64/include/asm/spinlock.h ]; then

          sed -i \
          's/"I" (1 << TICKET_SHIFT)/"r" (1 << TICKET_SHIFT)/g' \
          arch/arm64/include/asm/spinlock.h || true

        fi



        if [ -f include/linux/signal.h ]; then

          sed -i \
          's/case 2: set->sig\[1\] = -1;/case 2: if (_NSIG_WORDS > 1) set->sig[1] = -1;/' \
          include/linux/signal.h || true

        fi



    - name: Build Kernel

      run: |

        export PATH=/usr/lib/llvm-18/bin:$PATH


        set -o pipefail


        make -j$(nproc) \
          O=out \
          ARCH=arm64 \
          LLVM=1 \
          LLVM_IAS=1 \
          CC=clang-18 \
          LD=ld.lld-18 \
          AR=llvm-ar \
          NM=llvm-nm \
          OBJCOPY=llvm-objcopy \
          OBJDUMP=llvm-objdump \
          STRIP=llvm-strip \
          CLANG_TRIPLE=aarch64-linux-gnu- \
          CROSS_COMPILE=aarch64-linux-gnu- \
          KCFLAGS="-Wno-error -Wno-format -Wno-array-bounds -Wno-unused-variable" \
          2>&1 | tee build.log



    - name: Check Kernel Image

      run: |

        ls -lh out/arch/arm64/boot/ || true


        if [ -f out/arch/arm64/boot/Image.gz ]; then

          echo "Image.gz found"

        elif [ -f out/arch/arm64/boot/Image ]; then

          echo "Image found"

        else

          echo "Kernel Image missing"

          tail -100 build.log

          exit 1

        fi



    - name: Upload Kernel

      if: always()

      uses: actions/upload-artifact@v4

      with:

        name: Realme5i-Kernel

        path: |

          out/arch/arm64/boot/*

          out/.config

          build.log

        if-no-files-found: warn

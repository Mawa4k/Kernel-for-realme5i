name: Realme 5i Stock Kernel Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

    - name: Checkout Source
      uses: actions/checkout@v4


    - name: Install Dependencies
      run: |
        sudo apt update

        sudo apt install -y \
          bc \
          bison \
          flex \
          build-essential \
          libssl-dev \
          libelf-dev \
          python3 \
          cpio \
          rsync \
          clang-18 \
          lld-18 \
          llvm-18 \
          gcc-aarch64-linux-gnu


    - name: Toolchain
      run: |
        clang-18 --version
        ld.lld-18 --version


    - name: Clean Build
      run: |
        git reset --hard HEAD
        git clean -xfd

        rm -rf out


    - name: Show Prepare3
      run: |
        echo "===== Makefile prepare3 ====="
        nl -ba Makefile | sed -n '1170,1220p'


    - name: Patch Prepare3 Clean Check
      run: |
        python3 - <<'PY'
        from pathlib import Path
        import re

        p = Path("Makefile")
        s = p.read_text()

        # remove the source dirty check error
        s = re.sub(
            r'echo.*not clean.*make mrproper.*',
            'true',
            s
        )

        s = re.sub(
            r'\$\(error.*not clean.*\)',
            'true',
            s
        )

        p.write_text(s)

        print("prepare3 patch applied")
        PY


    - name: Prepare Config
      run: |
        mkdir -p out

        cp arch/arm64/configs/defconfig out/.config

        export KBUILD_OUTPUT=$PWD/out

        scripts/config --disable WERROR || true
        scripts/config --disable MODULE_SIG || true
        scripts/config --disable MODULE_SIG_FORCE || true

        make O=out ARCH=arm64 olddefconfig


    - name: Fix Clang 18
      run: |

        sed -i \
        's/"I" (1 << TICKET_SHIFT)/"r" (1 << TICKET_SHIFT)/g' \
        arch/arm64/include/asm/spinlock.h


        sed -i \
        's/case 2: set->sig\[1\] = -1;/case 2: if (_NSIG_WORDS > 1) set->sig[1] = -1;/' \
        include/linux/signal.h || true


    - name: Build Kernel
      run: |

        export PATH=/usr/lib/llvm-18/bin:$PATH
        export KBUILD_OUTPUT=$PWD/out

        make O=out \
          ARCH=arm64 \
          LLVM=1 \
          LLVM_IAS=1 \
          CC=clang-18 \
          LD=ld.lld-18 \
          KCFLAGS="-Wno-array-bounds -Wno-error" \
          CFLAGS_KERNEL="-Wno-array-bounds -Wno-error" \
          -j$(nproc) 2>&1 | tee build.log

        exit ${PIPESTATUS[0]}


    - name: Check Image
      run: |

        ls -lh out/arch/arm64/boot

        test -f out/arch/arm64/boot/Image.gz || \
        test -f out/arch/arm64/boot/Image


    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: Realme5i-Kernel
        path: |
          out/arch/arm64/boot/*
          build.log
          out/.config

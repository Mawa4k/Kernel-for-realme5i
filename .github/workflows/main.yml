name: Kernel Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

    - name: Checkout kernel source
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          bc \
          bison \
          flex \
          build-essential \
          libssl-dev \
          libelf-dev \
          dwarves \
          python3 \
          clang \
          lld \
          llvm \
          gcc-aarch64-linux-gnu

    - name: Prepare output
      run: |
        mkdir -p out

    - name: Setup config
      run: |
        cp arch/arm64/configs/vendor/trinket_defconfig out/.config || cp arch/arm64/configs/trinket_defconfig out/.config || true

        make O=out ARCH=arm64 olddefconfig

    - name: Kernel config fixes
      run: |
        scripts/config --file out/.config \
          -e CONFIG_MODULES \
          -e CONFIG_MODULE_UNLOAD \
          -e CONFIG_MODULE_FORCE_LOAD \
          -e CONFIG_MODULE_FORCE_UNLOAD

        scripts/config --file out/.config \
          -d CONFIG_MODULE_SIG \
          -d CONFIG_MODULE_SIG_FORCE \
          -d CONFIG_WERROR

        echo "CONFIG_SECTION_MISMATCH_WARN_ONLY=y" >> out/.config

        make O=out ARCH=arm64 olddefconfig

    - name: Fix cxd224x section mismatch
      run: |
        echo "Searching cxd224x..."

        grep -R "init_wqueue" -n drivers || true

        FILE=$(grep -rl "init_wqueue" drivers | head -n 1)

        if [ ! -z "$FILE" ]; then
          echo "Fixing: $FILE"

          sed -i \
          's/__init[[:space:]]\+init_wqueue/init_wqueue/g' \
          "$FILE"
        fi


    - name: Build kernel
      run: |
        set -o pipefail

        make \
          O=out \
          ARCH=arm64 \
          CC=clang \
          LLVM=1 \
          LLVM_IAS=1 \
          CROSS_COMPILE=aarch64-linux-gnu- \
          -j$(nproc) 2>&1 | tee build.log


    - name: Show build errors
      if: failure()
      run: |
        echo "====== ERROR REPORT ======"

        grep -iE \
        "error:|fatal:|modpost|undefined|ld.lld|failed" \
        build.log | tail -200 || true


    - name: Check output
      run: |
        ls -lh out/vmlinux || true
        ls -lh out/arch/arm64/boot/Image || true


    - name: Upload kernel files
      uses: actions/upload-artifact@v4
      with:
        name: kernel-build-output
        path: |
          out/vmlinux
          out/arch/arm64/boot/Image
          build.log

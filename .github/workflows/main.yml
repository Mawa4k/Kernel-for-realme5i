name: Realme 5i Kernel Build (No -z notext Test)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4
      with:
        clean: true
        fetch-depth: 1

    - name: Install Dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          bc bison flex build-essential \
          libssl-dev libelf-dev python3 python-is-python3 \
          cpio rsync \
          clang-18 llvm-18 lld-18 \
          gcc-aarch64-linux-gnu \
          binutils-aarch64-linux-gnu \
          device-tree-compiler kmod

    - name: Toolchain Check
      run: |
        clang-18 --version
        ld.lld-18 --version
        aarch64-linux-gnu-gcc --version
        aarch64-linux-gnu-as --version

    - name: Find Defconfig
      id: findcfg
      run: |
        echo "All defconfig files found:"
        find arch/arm64/configs -type f -name '*defconfig*' | sort

        CFG=$(find arch/arm64/configs -type f -name '*defconfig*' \
              | grep -iE 'trinket|sm6125|6125|k68' | head -n1)

        if [ -z "$CFG" ]; then
          CFG=$(find arch/arm64/configs -type f -name '*defconfig*' | head -n1)
        fi

        if [ -z "$CFG" ]; then
          echo "No defconfig file found at all!"
          exit 1
        fi

        REL=$(echo "$CFG" | sed 's|arch/arm64/configs/||')
        echo "Using defconfig: $REL"
        echo "defconfig=$REL" >> "$GITHUB_OUTPUT"

    - name: Create Build Directory
      run: |
        rm -rf out
        mkdir -p out

    - name: Setup Config
      env:
        DEFCONFIG: ${{ steps.findcfg.outputs.defconfig }}
      run: |
        export PATH=/usr/lib/llvm-18/bin:$PATH
        make O=out ARCH=arm64 \
          CC=clang-18 LD=ld.lld-18 \
          CLANG_TRIPLE=aarch64-linux-gnu- \
          CROSS_COMPILE=aarch64-linux-gnu- \
          "$DEFCONFIG"

        ./scripts/config --file out/.config \
          -d CC_STACKPROTECTOR_STRONG \
          -d CC_STACKPROTECTOR_REGULAR \
          -e CC_STACKPROTECTOR_NONE \
          -e MODULES \
          -e MODULE_FORCE_LOAD \
          -e MODULE_UNLOAD \
          -e MODULE_FORCE_UNLOAD \
          -d MODULE_SIG \
          -d MODULE_SIG_FORCE \
          -d MODULE_SIG_ALL \
          -e PSTORE \
          -e PSTORE_RAM \
          -e PSTORE_CONSOLE \
          -e PSTORE_PMSG

        yes "" | make O=out ARCH=arm64 \
          CC=clang-18 LD=ld.lld-18 \
          CLANG_TRIPLE=aarch64-linux-gnu- \
          CROSS_COMPILE=aarch64-linux-gnu- \
          oldconfig

    - name: Apply Clang 18 Fixes
      run: |
        # NOTE: TICKET_SHIFT / "I" constraint in spinlock.h is CORRECT as-is.
        # Do NOT change "I" to "r" — 65536 is a valid AArch64 immediate.

        if [ -f include/linux/signal.h ]; then
          sed -i 's/case 2: set->sig\[1\] = -1;/case 2: if (_NSIG_WORDS > 1) set->sig[1] = -1;/' \
            include/linux/signal.h || true
        fi

        find . -name "Makefile" -not -path "./out/*" -print0 | \
          xargs -0 sed -i -E 's/(^|[[:space:]])-Werror([[:space:]]|$)/\1\2/g'

    - name: Reset Generated Changes
      run: |
        git checkout -- include/generated arch/arm64/include/generated 2>/dev/null || true

    - name: Build Kernel
      env:
        DEFCONFIG: ${{ steps.findcfg.outputs.defconfig }}
      run: |
        export PATH=/usr/lib/llvm-18/bin:$PATH
        set -o pipefail
        make -j$(nproc) O=out \
          ARCH=arm64 \
          LLVM=1 \
          LLVM_IAS=1 \
          CC=clang-18 \
          LD=ld.lld-18 \
          AR=llvm-ar \
          NM=llvm-nm \
          OBJCOPY=llvm-objcopy \
          OBJDUMP=llvm-objdump \
          STRIP=llvm-strip \
          CLANG_TRIPLE=aarch64-linux-gnu- \
          CROSS_COMPILE=aarch64-linux-gnu- \
          KCFLAGS="-Wno-array-bounds -Wno-error -Wno-implicit-function-declaration -Wno-strict-prototypes -Wno-deprecated-non-prototype -Wno-implicit-int" \
          2>&1 | tee build.log

    - name: Extract Real Error
      if: failure()
      run: |
        echo "=== Lines containing 'error' ==="
        grep -n -i "error" build.log | grep -v "^--$" || echo "No explicit error lines found"
        echo ""
        echo "=== Last 80 lines of build.log ==="
        tail -n 80 build.log

    - name: Check Kernel Image
      run: |
        ls -lh out/arch/arm64/boot/ || true
        if [ -f out/arch/arm64/boot/Image.gz ]; then
          echo "Image.gz OK"
        elif [ -f out/arch/arm64/boot/Image ]; then
          echo "Image OK"
        else
          echo "Kernel Image missing — check build.log"
          tail -n 100 build.log
          exit 1
        fi

    - name: Copy Config For Verification
      run: |
        cp out/.config out/kernel.config

    - name: Upload Kernel
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Realme5i-Kernel-NoZNotext-Test
        path: |
          out/arch/arm64/boot/*
          out/kernel.config
          build.log
        if-no-files-found: warn
